[package]
name = "pulse"
version = "0.2.0"
edition = "2024"
description = "Intelligent system behavior analysis and observability platform"
default-run = "pulse"

[lib]
name = "pulse"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "1.1"
log = "0.4"
env_logger = "0.11"
ctrlc = { version = "3.5", features = ["termination"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "pulse"
path = "src/bin/pulse.rs"

[[bin]]
name = "pulse-daemon"
path = "src/bin/daemon.rs"